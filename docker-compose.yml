services:
  absen-yolo:
    build: .
    container_name: absen_yolo_app
    ports:
      - "5005:5005"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=slimsumpo
    restart: unless-stopped
    volumes:
      # Mount file model YOLO secara terpisah (opsional jika sering diupdate)
      # - ./bestmodel.pt:/app/bestmodel.pt
      - ./static:/app/static
      - ./templates:/app/templates
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: absen_yolo_db
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: slimsumpo
    volumes:
      - db_data:/var/lib/mysql
      # Mount init.sql untuk otomatis create table & insert data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
